<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#C1121F"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#fff" stroke-width="2" opacity="0.3"/>

  <!-- Graduation cap / mortarboard shape -->
  <g transform="translate(100,100)">
    <!-- Cap top (diamond) -->
    <polygon points="0,-42 42,0 0,42 -42,0" fill="#fff" opacity="0.95"/>
    <!-- Cap board -->
    <rect x="-36" y="-6" width="72" height="12" rx="2" fill="#fff"/>
    <!-- Tassel cord -->
    <line x1="32" y1="0" x2="48" y2="20" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
    <circle cx="48" cy="22" r="4" fill="#FFD700"/>
    <!-- Book/document icon below cap -->
    <rect x="-22" y="18" width="44" height="32" rx="4" fill="#fff" opacity="0.9"/>
    <line x1="-14" y1="26" x2="14" y2="26" stroke="#C1121F" stroke-width="2"/>
    <line x1="-14" y1="32" x2="14" y2="32" stroke="#C1121F" stroke-width="2"/>
    <line x1="-14" y1="38" x2="6" y2="38" stroke="#C1121F" stroke-width="2"/>
  </g>

  <!-- University name arc text (simplified) -->
  <text x="100" y="178" text-anchor="middle" font-family="Georgia,serif" font-size="10" font-weight="bold" fill="#fff" opacity="0.85">NUSA PUTRA</text>
  <text x="100" y="30" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#fff" opacity="0.7">UNIVERSITAS</text>
</svg>
